name: shopco_mobile
description: "SHOP.CO — Modern Fashion E-Commerce Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.0

  # Image Caching
  cached_network_image: ^3.4.1

  # Local Storage (Cart persistence)
  shared_preferences: ^2.3.1

  # Fonts
  google_fonts: ^6.2.1

  # URL Launcher (Payment gateway)
  url_launcher: ^6.3.0

  # Loading Skeletons
  shimmer: ^3.0.0

  # Star Ratings
  flutter_rating_bar: ^4.0.1

  # Carousel
  carousel_slider: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
