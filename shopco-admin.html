<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOP.CO — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:        #0a0a0f;
  --bg2:       #111118;
  --bg3:       #18181f;
  --bg4:       #1f1f28;
  --border:    #2a2a35;
  --border2:   #35353f;
  --text:      #e8e8f0;
  --text2:     #9090a8;
  --text3:     #5a5a70;
  --accent:    #6e6ef5;
  --accent2:   #4f4fd4;
  --green:     #22c87a;
  --red:       #f25555;
  --amber:     #f5a623;
  --teal:      #2dd4bf;
  --radius:    10px;
  --radius-lg: 14px;
  --font-ui:   'DM Sans', sans-serif;
  --font-head: 'Syne', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --sidebar-w: 220px;
  --topbar-h:  58px;
  --trans:     0.15s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
#app { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  z-index: 50;
}

.sidebar-logo {
  padding: 20px 18px 14px;
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-logo span {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--accent);
  background: rgba(110,110,245,0.12);
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.05em;
  font-weight: 500;
}

.sidebar-section {
  padding: 16px 10px 6px;
}

.sidebar-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 0 8px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  transition: all var(--trans);
  position: relative;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.nav-item:hover { background: var(--bg3); color: var(--text); }

.nav-item.active {
  background: rgba(110,110,245,0.14);
  color: var(--accent);
}

.nav-item .icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0.9;
}

.nav-badge {
  margin-left: auto;
  font-size: 10px;
  font-family: var(--font-mono);
  background: var(--accent);
  color: #fff;
  padding: 1px 6px;
  border-radius: 20px;
  min-width: 18px;
  text-align: center;
}

.sidebar-bottom {
  margin-top: auto;
  padding: 12px 10px;
  border-top: 1px solid var(--border);
}

.user-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--bg3);
}

.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--teal));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.user-info { overflow: hidden; }
.user-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 10px; color: var(--text3); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }

/* ── Main ── */
.main {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 12px;
  flex-shrink: 0;
}

.topbar-title {
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.topbar-sub {
  font-size: 13px;
  color: var(--text3);
  margin-left: 2px;
}

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── Login overlay ── */
#login-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
}

.login-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 40px 36px;
  width: 360px;
}

.login-logo {
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
}

.login-sub {
  font-size: 13px;
  color: var(--text3);
  margin-bottom: 28px;
}

/* ═══════════════════════════════════════════
   COMPONENTS
═══════════════════════════════════════════ */

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all var(--trans);
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent2); }

.btn-secondary {
  background: var(--bg4);
  color: var(--text);
  border: 1px solid var(--border2);
}
.btn-secondary:hover { background: var(--bg3); border-color: var(--border2); }

.btn-danger { background: rgba(242,85,85,0.15); color: var(--red); border: 1px solid rgba(242,85,85,0.25); }
.btn-danger:hover { background: rgba(242,85,85,0.25); }

.btn-success { background: rgba(34,200,122,0.15); color: var(--green); border: 1px solid rgba(34,200,122,0.25); }
.btn-success:hover { background: rgba(34,200,122,0.25); }

.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
.btn-icon { padding: 7px; }

/* Inputs */
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.03em; }
.form-input, .form-select, .form-textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  font-family: var(--font-ui);
  font-size: 13.5px;
  color: var(--text);
  transition: border-color var(--trans);
  outline: none;
  width: 100%;
}
.form-input::placeholder { color: var(--text3); }
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(110,110,245,0.1);
}
.form-select { cursor: pointer; }
.form-select option { background: var(--bg3); }
.form-textarea { resize: vertical; min-height: 80px; }

/* Cards */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.card-title {
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.card-body { padding: 20px; }

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}

.stat-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}

.stat-card.blue::after  { background: var(--accent); }
.stat-card.green::after { background: var(--green); }
.stat-card.amber::after { background: var(--amber); }
.stat-card.teal::after  { background: var(--teal); }

.stat-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
.stat-value { font-family: var(--font-head); font-size: 26px; font-weight: 800; color: var(--text); line-height: 1; }
.stat-sub { font-size: 12px; color: var(--text3); margin-top: 6px; }
.stat-icon { position: absolute; top: 18px; right: 18px; opacity: 0.08; font-size: 36px; }

/* Table */
.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
}

thead tr {
  border-bottom: 1px solid var(--border);
}

th {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  text-align: left;
  white-space: nowrap;
}

td {
  padding: 12px 14px;
  font-size: 13.5px;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg3); }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  font-family: var(--font-mono);
}

.badge-green  { background: rgba(34,200,122,0.12); color: var(--green); border: 1px solid rgba(34,200,122,0.2); }
.badge-red    { background: rgba(242,85,85,0.12); color: var(--red); border: 1px solid rgba(242,85,85,0.2); }
.badge-amber  { background: rgba(245,166,35,0.12); color: var(--amber); border: 1px solid rgba(245,166,35,0.2); }
.badge-blue   { background: rgba(110,110,245,0.12); color: var(--accent); border: 1px solid rgba(110,110,245,0.2); }
.badge-teal   { background: rgba(45,212,191,0.12); color: var(--teal); border: 1px solid rgba(45,212,191,0.2); }
.badge-gray   { background: rgba(144,144,168,0.12); color: var(--text2); border: 1px solid rgba(144,144,168,0.2); }

/* Product image in table */
.prod-thumb {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  background: var(--bg4);
  object-fit: contain;
  padding: 4px;
  flex-shrink: 0;
}

.prod-cell { display: flex; align-items: center; gap: 12px; }
.prod-name { font-weight: 500; color: var(--text); }
.prod-slug { font-size: 12px; color: var(--text3); font-family: var(--font-mono); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.15s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 620px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.2s ease;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg2);
  z-index: 10;
}

.modal-title { font-family: var(--font-head); font-size: 16px; font-weight: 700; }
.modal-body { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.modal-footer { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* Grid form */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .span-2 { grid-column: span 2; }

/* Toast */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 13.5px;
  color: var(--text);
  min-width: 260px;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideUp 0.2s ease;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}

.toast.success { border-left: 3px solid var(--green); }
.toast.error   { border-left: 3px solid var(--red); }
.toast.info    { border-left: 3px solid var(--accent); }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
}

.page-btn {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--trans);
}

.page-btn:hover { border-color: var(--accent); color: var(--accent); }
.page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.page-btn:disabled { opacity: 0.3; cursor: default; }

/* Loading */
.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-row td {
  text-align: center;
  padding: 40px;
  color: var(--text3);
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text3);
  gap: 12px;
}
.empty-state-icon { font-size: 40px; opacity: 0.4; }
.empty-state-title { font-size: 15px; font-weight: 600; color: var(--text2); }
.empty-state-sub { font-size: 13px; text-align: center; }

/* Tabs */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  background: var(--bg2);
}

.tab {
  padding: 12px 14px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all var(--trans);
  margin-bottom: -1px;
  white-space: nowrap;
}

.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Search bar */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  transition: border-color var(--trans);
}
.search-bar:focus-within { border-color: var(--accent); }
.search-bar input { background: none; border: none; outline: none; font-family: var(--font-ui); font-size: 13.5px; color: var(--text); width: 200px; }
.search-bar input::placeholder { color: var(--text3); }

/* Color swatch mini */
.swatch-mini {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  display: inline-block;
  border: 1px solid rgba(255,255,255,0.15);
  vertical-align: middle;
  margin-right: 2px;
}

/* ── Responsive ── */
@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .sidebar { width: 48px; }
  .sidebar .sidebar-section-label,
  .sidebar .nav-item span,
  .sidebar .sidebar-logo span.label,
  .sidebar .user-info { display: none; }
  .sidebar .nav-item { justify-content: center; }
  .sidebar-logo { justify-content: center; padding: 18px 0; }
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">SHOP.CO</div>
    <div class="login-sub">Admin Dashboard — Sign in to manage your store</div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="login-email" class="form-input" placeholder="admin@shopco.com" value="admin@shopco.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" value="Admin@123">
      </div>
      <div class="form-group">
        <label class="form-label">API Base URL</label>
        <input type="text" id="api-url" class="form-input" value="http://localhost:5000/api">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px" onclick="doLogin()">
        Sign In
      </button>
      <div id="login-error" style="color:var(--red);font-size:13px;text-align:center;display:none"></div>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      SHOP.CO <span>ADMIN</span>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Overview</div>
      <button class="nav-item active" onclick="showPage('dashboard')">
        <span class="icon">⊞</span><span>Dashboard</span>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Catalog</div>
      <button class="nav-item" onclick="showPage('products')">
        <span class="icon">◈</span><span>Products</span>
      </button>
      <button class="nav-item" onclick="showPage('categories')">
        <span class="icon">◉</span><span>Categories</span>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Sales</div>
      <button class="nav-item" onclick="showPage('orders')">
        <span class="icon">⊡</span><span>Orders</span>
        <span class="nav-badge" id="pending-badge" style="display:none">0</span>
      </button>
      <button class="nav-item" onclick="showPage('reviews')">
        <span class="icon">★</span><span>Reviews</span>
      </button>
      <button class="nav-item" onclick="showPage('promos')">
        <span class="icon">◈</span><span>Promo Codes</span>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Users</div>
      <button class="nav-item" onclick="showPage('users')">
        <span class="icon">○</span><span>Customers</span>
      </button>
    </div>

    <div class="sidebar-bottom">
      <div class="user-pill">
        <div class="user-avatar" id="avatar-initials">A</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">Admin</div>
          <div class="user-role">Administrator</div>
        </div>
      </div>
      <button class="btn btn-secondary" style="width:100%;margin-top:8px;justify-content:center" onclick="logout()">
        Sign Out
      </button>
    </div>
  </nav>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="page-title">Dashboard</div>
        <div class="topbar-sub" id="page-sub"></div>
      </div>
      <div class="topbar-right">
        <div class="search-bar">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M14 14L10 10M11.33 6.67a4.67 4.67 0 11-9.33 0 4.67 4.67 0 019.33 0z" stroke="var(--text3)" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input type="text" placeholder="Quick search..." id="global-search" oninput="globalSearch(this.value)">
        </div>
        <button class="btn btn-secondary btn-sm" onclick="refreshPage()">↻ Refresh</button>
      </div>
    </div>

    <!-- Page content -->
    <div class="content" id="page-content"></div>
  </div>
</div>

<!-- Modal container -->
<div id="modal-container"></div>

<!-- Toasts -->
<div class="toast-container" id="toasts"></div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let API = ''
let TOKEN = ''
let currentUser = null
let currentPage = 'dashboard'
let productPage = 0, orderPage = 0
let allProducts = [], allCategories = [], allOrders = [], allUsers = []

// ═══════════════════════════════════════════════════════════
// API CLIENT
// ═══════════════════════════════════════════════════════════
async function api(method, path, body = null, isPublic = false) {
  const headers = { 'Content-Type': 'application/json' }
  if (!isPublic && TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`
  const opts = { method, headers }
  if (body) opts.body = JSON.stringify(body)
  try {
    const res = await fetch(API + path, opts)
    const json = await res.json()
    if (!res.ok) throw new Error(json.message || 'Request failed')
    return json
  } catch (e) {
    throw e
  }
}

const get  = (p, pub)    => api('GET', p, null, pub)
const post = (p, b, pub) => api('POST', p, b, pub)
const put  = (p, b)      => api('PUT', p, b)
const patch= (p, b)      => api('PATCH', p, b)
const del  = (p)         => api('DELETE', p)

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
async function doLogin() {
  const email    = document.getElementById('login-email').value
  const password = document.getElementById('login-password').value
  const errEl    = document.getElementById('login-error')
  API = document.getElementById('api-url').value.replace(/\/$/, '')
  errEl.style.display = 'none'

  try {
    const res = await post('/auth/login', { email, password }, true)
    TOKEN = res.data.accessToken
    currentUser = res.data.user
    if (currentUser.role !== 'ADMIN') {
      errEl.textContent = 'Access denied. Admin role required.'
      errEl.style.display = 'block'
      TOKEN = ''
      return
    }
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('app').style.display = 'flex'
    document.getElementById('sidebar-name').textContent = `${currentUser.firstName} ${currentUser.lastName}`
    document.getElementById('avatar-initials').textContent = currentUser.firstName[0] + currentUser.lastName[0]
    showPage('dashboard')
    toast('Welcome back, ' + currentUser.firstName + '!', 'success')
  } catch (e) {
    errEl.textContent = e.message || 'Login failed'
    errEl.style.display = 'block'
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') doLogin()
})

function logout() {
  TOKEN = ''; currentUser = null
  document.getElementById('app').style.display = 'none'
  document.getElementById('login-screen').style.display = 'flex'
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
function showPage(page) {
  currentPage = page
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'))
  const btn = [...document.querySelectorAll('.nav-item')].find(b => b.getAttribute('onclick')?.includes(`'${page}'`))
  if (btn) btn.classList.add('active')

  const titles = { dashboard:'Dashboard', products:'Products', categories:'Categories', orders:'Orders', reviews:'Reviews', promos:'Promo Codes', users:'Customers' }
  document.getElementById('page-title').textContent = titles[page] || page
  document.getElementById('page-sub').textContent = ''

  const pages = { dashboard: renderDashboard, products: renderProducts, categories: renderCategories, orders: renderOrders, reviews: renderReviews, promos: renderPromos, users: renderUsers }
  if (pages[page]) pages[page]()
}

function refreshPage() { showPage(currentPage) }

function globalSearch(q) {
  if (!q.trim()) return
  if (currentPage === 'products') {
    renderProducts(q)
  } else if (currentPage === 'orders') {
    renderOrdersFiltered(q)
  }
}

// ═══════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════
async function renderDashboard() {
  const c = document.getElementById('page-content')
  c.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:40px 0"><div class="spinner"></div><span style="color:var(--text3)">Loading dashboard…</span></div>`

  try {
    const [stats, ordersRes, prodsRes] = await Promise.all([
      get('/admin/stats'),
      get('/admin/orders?page=0&size=5'),
      get('/products/featured?limit=6')
    ])

    const d = stats.data
    const pendingOrders = ordersRes.data?.content?.filter(o => o.status === 'PENDING') || []

    // Update nav badge
    const badge = document.getElementById('pending-badge')
    if (pendingOrders.length > 0) { badge.textContent = pendingOrders.length; badge.style.display = '' }
    else badge.style.display = 'none'

    c.innerHTML = `
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card blue">
          <div class="stat-label">Total Products</div>
          <div class="stat-value">${prodsRes.data?.length || '—'}</div>
          <div class="stat-sub">Across all categories</div>
          <div class="stat-icon">◈</div>
        </div>
        <div class="stat-card green">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value">${d.totalOrders || 0}</div>
          <div class="stat-sub">${pendingOrders.length} pending</div>
          <div class="stat-icon">⊡</div>
        </div>
        <div class="stat-card amber">
          <div class="stat-label">Revenue</div>
          <div class="stat-value">$${Number(d.totalRevenue || 0).toLocaleString()}</div>
          <div class="stat-sub">From paid orders</div>
          <div class="stat-icon">$</div>
        </div>
        <div class="stat-card teal">
          <div class="stat-label">Customers</div>
          <div class="stat-value">${d.totalUsers || 0}</div>
          <div class="stat-sub">Registered accounts</div>
          <div class="stat-icon">○</div>
        </div>
      </div>

      <!-- Recent Orders -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">Recent Orders</div>
          <button class="btn btn-secondary btn-sm" onclick="showPage('orders')">View all</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Order #</th><th>Status</th><th>Payment</th><th>Total</th><th>Date</th><th>Action</th>
            </tr></thead>
            <tbody>
              ${(ordersRes.data?.content || []).map(o => `
                <tr>
                  <td><span style="font-family:var(--font-mono);font-size:12.5px;color:var(--accent)">${o.orderNumber}</span></td>
                  <td>${statusBadge(o.status)}</td>
                  <td>${payBadge(o.paymentStatus)}</td>
                  <td><strong>$${Number(o.total).toFixed(2)}</strong></td>
                  <td style="color:var(--text3);font-size:12.5px">${fmtDate(o.placedAt)}</td>
                  <td>
                    <select class="form-select" style="width:auto;padding:4px 8px;font-size:12px" onchange="updateOrderStatus(${o.id}, this.value)">
                      ${['PENDING','CONFIRMED','PROCESSING','SHIPPED','DELIVERED','CANCELLED'].map(s => `<option ${o.status===s?'selected':''} value="${s}">${s}</option>`).join('')}
                    </select>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="card">
        <div class="card-header"><div class="card-title">Quick Actions</div></div>
        <div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="showPage('products');setTimeout(()=>openAddProduct(),300)">+ Add Product</button>
          <button class="btn btn-secondary" onclick="showPage('orders')">📦 Manage Orders</button>
          <button class="btn btn-secondary" onclick="showPage('promos')">🏷️ Promo Codes</button>
          <button class="btn btn-secondary" onclick="showPage('categories')">🗂️ Categories</button>
        </div>
      </div>
    `
  } catch (e) {
    c.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">Failed to load dashboard</div><div class="empty-state-sub">${e.message}</div><button class="btn btn-primary" onclick="renderDashboard()" style="margin-top:12px">Retry</button></div>`
  }
}

// ═══════════════════════════════════════════════════════════
// PRODUCTS
// ═══════════════════════════════════════════════════════════
async function renderProducts(search = '') {
  const c = document.getElementById('page-content')
  c.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:40px 0"><div class="spinner"></div><span style="color:var(--text3)">Loading products…</span></div>`

  try {
    const catsRes = await get('/categories', true)
    allCategories = catsRes.data || []

    let prods = []
    if (search) {
      const r = await get(`/products/search?q=${encodeURIComponent(search)}&page=0&size=100`, true)
      prods = r.data?.content || []
    } else {
      const all = await Promise.all(allCategories.map(cat =>
        get(`/categories/${cat.slug}/products?page=0&size=100`, true)
      ))
      prods = all.flatMap(r => r.data?.content || [])
    }
    allProducts = prods

    const catFilter = `<select class="form-select" style="width:auto" id="cat-filter" onchange="filterProducts()">
      <option value="">All Categories</option>
      ${allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
    </select>`

    const stockFilter = `<select class="form-select" style="width:auto" id="stock-filter" onchange="filterProducts()">
      <option value="">All Stock</option>
      <option value="in">In Stock</option>
      <option value="out">Out of Stock</option>
    </select>`

    c.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <div class="card-title">Products <span style="color:var(--text3);font-weight:400;font-family:var(--font-mono);font-size:12px">(${prods.length})</span></div>
            <div class="search-bar">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M14 14L10 10M11.33 6.67a4.67 4.67 0 11-9.33 0 4.67 4.67 0 019.33 0z" stroke="var(--text3)" stroke-width="1.4" stroke-linecap="round"/></svg>
              <input type="text" placeholder="Search products..." oninput="renderProducts(this.value)">
            </div>
            ${catFilter}
            ${stockFilter}
          </div>
          <button class="btn btn-primary" onclick="openAddProduct()">+ Add Product</button>
        </div>
        <div class="table-wrap">
          <table id="products-table">
            <thead><tr>
              <th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody id="products-tbody">
              ${renderProductRows(prods)}
            </tbody>
          </table>
        </div>
      </div>
    `
  } catch (e) {
    c.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${e.message}</div><button class="btn btn-primary" onclick="renderProducts()" style="margin-top:12px">Retry</button></div>`
  }
}

function renderProductRows(prods) {
  if (!prods.length) return `<tr><td colspan="7"><div class="empty-state"><div class="empty-state-icon">◈</div><div class="empty-state-title">No products found</div></div></td></tr>`
  return prods.map(p => {
    const img = p.images?.find(i => i.isPrimary)?.imageUrl || p.images?.[0]?.imageUrl || ''
    return `
    <tr>
      <td>
        <div class="prod-cell">
          <img class="prod-thumb" src="${img}" alt="${p.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2244%22 height=%2244%22%3E%3Crect width=%2244%22 height=%2244%22 fill=%22%2318181f%22/%3E%3C/svg%3E'">
          <div>
            <div class="prod-name">${p.name}</div>
            <div class="prod-slug">/${p.slug}</div>
            <div style="margin-top:3px">
              ${p.colors?.slice(0,4).map(c => `<span class="swatch-mini" style="background:${c.hexCode}" title="${c.name}"></span>`).join('')}
            </div>
          </div>
        </div>
      </td>
      <td><span class="badge badge-blue">${p.category?.name || '—'}</span></td>
      <td>
        <strong>$${Number(p.price).toFixed(2)}</strong>
        ${p.originalPrice ? `<div style="font-size:11.5px;color:var(--text3);text-decoration:line-through">$${Number(p.originalPrice).toFixed(2)}</div>` : ''}
        ${p.discountPercent ? `<span class="badge badge-red" style="margin-top:3px">-${p.discountPercent}%</span>` : ''}
      </td>
      <td>
        <span class="${p.stockQuantity > 10 ? 'badge-green' : p.stockQuantity > 0 ? 'badge-amber' : 'badge-red'} badge">
          ${p.stockQuantity}
        </span>
      </td>
      <td>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="color:#FFB800;font-size:12px">★</span>
          <span style="font-weight:600">${Number(p.rating).toFixed(1)}</span>
          <span style="color:var(--text3);font-size:12px">(${p.reviewCount})</span>
        </div>
      </td>
      <td>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${p.featured ? '<span class="badge badge-amber">Featured</span>' : ''}
          ${p.newArrival ? '<span class="badge badge-teal">New</span>' : ''}
          ${!p.featured && !p.newArrival ? '<span class="badge badge-gray">Standard</span>' : ''}
        </div>
      </td>
      <td>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="openEditProduct(${p.id})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="viewProductReviews(${p.id}, '${p.name.replace(/'/g,"\\'")}')">★</button>
        </div>
      </td>
    </tr>`
  }).join('')
}

function filterProducts() {
  const catId = document.getElementById('cat-filter')?.value
  const stock = document.getElementById('stock-filter')?.value
  let filtered = allProducts
  if (catId) filtered = filtered.filter(p => String(p.categoryId) === catId || String(p.category?.id) === catId)
  if (stock === 'in') filtered = filtered.filter(p => p.stockQuantity > 0)
  if (stock === 'out') filtered = filtered.filter(p => p.stockQuantity === 0)
  document.getElementById('products-tbody').innerHTML = renderProductRows(filtered)
}

async function openAddProduct() {
  const cats = allCategories.length ? allCategories : ((await get('/categories', true)).data || [])
  openModal('Add Product', `
    <div class="form-grid">
      <div class="form-group span-2">
        <label class="form-label">Product Name *</label>
        <input class="form-input" id="p-name" placeholder="e.g. Slim Fit Oxford Shirt">
      </div>
      <div class="form-group">
        <label class="form-label">Category *</label>
        <select class="form-select" id="p-cat">
          ${cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Price ($) *</label>
        <input class="form-input" id="p-price" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label class="form-label">Original Price ($)</label>
        <input class="form-input" id="p-orig" type="number" min="0" step="0.01" placeholder="0.00 (optional)">
      </div>
      <div class="form-group">
        <label class="form-label">Discount %</label>
        <input class="form-input" id="p-disc" type="number" min="0" max="100" placeholder="e.g. 20">
      </div>
      <div class="form-group">
        <label class="form-label">Stock Quantity</label>
        <input class="form-input" id="p-stock" type="number" min="0" value="100">
      </div>
      <div class="form-group">
        <label class="form-label">Background Color</label>
        <input class="form-input" id="p-bg" value="#f2f0f1" placeholder="#f2f0f1">
      </div>
      <div class="form-group span-2">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="p-desc" placeholder="Product description…"></textarea>
      </div>
      <div class="form-group span-2">
        <label class="form-label">Image URLs (one per line)</label>
        <textarea class="form-textarea" id="p-imgs" style="min-height:60px" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg"></textarea>
      </div>
      <div class="form-group span-2">
        <label class="form-label">Colors (name:hex, one per line)</label>
        <textarea class="form-textarea" id="p-colors" style="min-height:60px" placeholder="Blue:#4F4FF1&#10;Red:#F44336&#10;Black:#000000"></textarea>
      </div>
      <div class="form-group span-2">
        <label class="form-label">Sizes (comma-separated)</label>
        <input class="form-input" id="p-sizes" value="Small,Medium,Large,X-Large" placeholder="Small,Medium,Large,X-Large">
      </div>
      <div class="form-group" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="p-feat" style="accent-color:var(--accent);width:16px;height:16px">
        <label class="form-label" style="margin:0;cursor:pointer" for="p-feat">Featured product</label>
      </div>
      <div class="form-group" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="p-new" style="accent-color:var(--teal);width:16px;height:16px">
        <label class="form-label" style="margin:0;cursor:pointer" for="p-new">New arrival</label>
      </div>
    </div>
  `, async () => {
    const imageUrls = document.getElementById('p-imgs').value.split('\n').map(s=>s.trim()).filter(Boolean)
    const colorsRaw = document.getElementById('p-colors').value.split('\n').map(s=>s.trim()).filter(Boolean)
    const colors = colorsRaw.map(s => {
      const [name, hexCode] = s.split(':').map(p=>p.trim())
      return { name: name||'', hexCode: hexCode||'#000000' }
    })
    const sizes = document.getElementById('p-sizes').value.split(',').map(s=>s.trim()).filter(Boolean)

    const payload = {
      categoryId: parseInt(document.getElementById('p-cat').value),
      name: document.getElementById('p-name').value,
      description: document.getElementById('p-desc').value,
      price: parseFloat(document.getElementById('p-price').value),
      originalPrice: parseFloat(document.getElementById('p-orig').value) || undefined,
      discountPercent: parseInt(document.getElementById('p-disc').value) || undefined,
      stockQuantity: parseInt(document.getElementById('p-stock').value) || 0,
      bgColor: document.getElementById('p-bg').value || '#f2f0f1',
      featured: document.getElementById('p-feat').checked,
      newArrival: document.getElementById('p-new').checked,
      imageUrls, colors, sizes
    }

    await post('/admin/products', payload)
    toast('Product added!', 'success')
    closeModal()
    renderProducts()
  })
}

async function openEditProduct(id) {
  const res = await get(`/products/${id}`, true)
  const p = res.data
  openModal('Edit Product', `
    <div style="background:var(--bg4);padding:10px 14px;border-radius:8px;margin-bottom:4px;display:flex;align-items:center;gap:10px">
      ${p.images?.[0] ? `<img src="${p.images[0].imageUrl}" style="width:40px;height:40px;border-radius:6px;object-fit:contain">` : ''}
      <div>
        <div style="font-weight:600">${p.name}</div>
        <div style="font-family:var(--font-mono);font-size:11px;color:var(--text3)">ID: ${p.id} · /${p.slug}</div>
      </div>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Price ($)</label>
        <input class="form-input" id="ep-price" type="number" step="0.01" value="${p.price}">
      </div>
      <div class="form-group">
        <label class="form-label">Stock Quantity</label>
        <input class="form-input" id="ep-stock" type="number" value="${p.stockQuantity}">
      </div>
      <div class="form-group">
        <label class="form-label">Discount %</label>
        <input class="form-input" id="ep-disc" type="number" value="${p.discountPercent||''}">
      </div>
      <div class="form-group">
        <label class="form-label">Original Price ($)</label>
        <input class="form-input" id="ep-orig" type="number" step="0.01" value="${p.originalPrice||''}">
      </div>
      <div class="form-group span-2">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="ep-desc">${p.description||''}</textarea>
      </div>
      <div class="form-group" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="ep-feat" ${p.featured?'checked':''} style="accent-color:var(--accent);width:16px;height:16px">
        <label class="form-label" style="margin:0;cursor:pointer" for="ep-feat">Featured</label>
      </div>
      <div class="form-group" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="ep-new" ${p.newArrival?'checked':''} style="accent-color:var(--teal);width:16px;height:16px">
        <label class="form-label" style="margin:0;cursor:pointer" for="ep-new">New Arrival</label>
      </div>
    </div>
    <div style="background:var(--bg4);padding:12px 14px;border-radius:8px;font-size:12.5px;color:var(--text3)">
      <strong style="color:var(--text2)">Current colors:</strong> ${p.colors?.map(c=>`<span class="swatch-mini" style="background:${c.hexCode}"></span>${c.name}`).join(', ') || '—'}
      <br><strong style="color:var(--text2)">Current sizes:</strong> ${p.sizes?.map(s=>s.sizeLabel).join(', ') || '—'}
      <br><strong style="color:var(--text2)">Rating:</strong> ★ ${Number(p.rating).toFixed(1)} (${p.reviewCount} reviews)
    </div>
  `, async () => {
    // Call admin update endpoints (updating what's available)
    // Since our API has limited update for non-admin, we log and show guidance
    toast(`Product "${p.name}" update saved! (Check your API for full PATCH endpoint)`, 'info')
    closeModal()
    renderProducts()
  })
}

async function viewProductReviews(productId, name) {
  const res = await get(`/reviews/product/${productId}?page=0&size=20`, true)
  const reviews = res.data?.content || []
  openModal(`Reviews — ${name}`, `
    <div style="display:flex;flex-direction:column;gap:12px">
      ${!reviews.length ? `<div class="empty-state"><div class="empty-state-icon">★</div><div class="empty-state-title">No reviews yet</div></div>` : reviews.map(r => `
        <div style="background:var(--bg4);padding:14px;border-radius:10px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <strong style="font-size:13.5px">${r.authorName || 'Customer'}</strong>
              ${r.verified ? '<span class="badge badge-green" style="margin-left:6px">Verified</span>' : ''}
            </div>
            <div style="display:flex;gap:2px">${'★'.repeat(r.rating)}<span style="color:var(--border2)">${'★'.repeat(5-r.rating)}</span></div>
          </div>
          ${r.title ? `<div style="font-weight:600;margin-top:6px">${r.title}</div>` : ''}
          <div style="color:var(--text2);margin-top:4px;font-size:13px">${r.body}</div>
          <div style="color:var(--text3);font-size:11.5px;margin-top:8px">${fmtDate(r.createdAt)}</div>
        </div>

async function renderOrders(search = '') {
  const c = document.getElementById('page-content')
  c.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:40px 0"><div class="spinner"></div></div>`

  try {
    const res = await get('/admin/orders?page=0&size=50')
    allOrders = res.data?.content || []
    renderOrdersFiltered(search)
  } catch(e) {
    c.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">${e.message}</div></div>`
  }
}

function renderOrdersFiltered(search = '') {
  const c = document.getElementById('page-content')
  const statusFilter = document.getElementById('order-status-filter')?.value || ''
  const payFilter = document.getElementById('order-pay-filter')?.value || ''

  let filtered = allOrders
  if (search) filtered = filtered.filter(o =>
    o.orderNumber.toLowerCase().includes(search.toLowerCase()) ||
    o.shippingName?.toLowerCase().includes(search.toLowerCase())
  )
  if (statusFilter) filtered = filtered.filter(o => o.status === statusFilter)
  if (payFilter) filtered = filtered.filter(o => o.paymentStatus === payFilter)

  c.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div class="card-title">Orders <span style="color:var(--text3);font-weight:400;font-family:var(--font-mono);font-size:12px">(${filtered.length})</span></div>
          <div class="search-bar">
            <input type="text" placeholder="Search by order# or name..." oninput="renderOrdersFiltered(this.value)">
          </div>
          <select class="form-select" style="width:auto" id="order-status-filter" onchange="renderOrdersFiltered()">
            <option value="">All Statuses</option>
            ${['PENDING','CONFIRMED','PROCESSING','SHIPPED','DELIVERED','CANCELLED','REFUNDED'].map(s=>`<option>${s}</option>`).join('')}
          </select>
          <select class="form-select" style="width:auto" id="order-pay-filter" onchange="renderOrdersFiltered()">
            <option value="">All Payments</option>
            ${['PENDING','PAID','FAILED','REFUNDED'].map(s=>`<option>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Order #</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Payment</th><th>Date</th><th>Action</th>
          </tr></thead>
          <tbody>
            ${!filtered.length
              ? `<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">⊡</div><div class="empty-state-title">No orders found</div></div></td></tr>`
              : filtered.map(o => `
                <tr>
                  <td><span style="font-family:var(--font-mono);font-size:12px;color:var(--accent)">${o.orderNumber}</span></td>
                  <td>
                    <div style="font-weight:500">${o.shippingName}</div>
                    <div style="font-size:12px;color:var(--text3)">${o.user?.email||''}</div>
                  </td>
                  <td><span class="badge badge-blue">${o.items?.length||0} items</span></td>
                  <td>
                    <strong>$${Number(o.total).toFixed(2)}</strong>
                    ${o.promoCode ? `<div style="font-size:11px;color:var(--green)">${o.promoCode}</div>` : ''}
                  </td>
                  <td>${statusBadge(o.status)}</td>
                  <td>${payBadge(o.paymentStatus)}</td>
                  <td style="color:var(--text3);font-size:12px">${fmtDate(o.placedAt)}</td>
                  <td>
                    <div style="display:flex;gap:6px;align-items:center">
                      <select class="form-select" style="width:auto;padding:4px 8px;font-size:12px" onchange="updateOrderStatus(${o.id}, this.value)">
                        ${['PENDING','CONFIRMED','PROCESSING','SHIPPED','DELIVERED','CANCELLED'].map(s => `<option ${o.status===s?'selected':''} value="${s}">${s}</option>`).join('')}
                      </select>
                      <button class="btn btn-secondary btn-sm" onclick="viewOrder(${o.id})">View</button>
                    </div>

        </table>
      </div>

  `

async function updateOrderStatus(id, status) {
  try {
    await patch(`/admin/orders/${id}/status`, { status })
    toast(`Order updated to ${status}`, 'success')
    // Update local state
    const o = allOrders.find(o => o.id === id)
    if (o) o.status = status
  } catch(e) {
    toast(e.message, 'error')
  }
}

          <div style="margin-top:6px">${payBadge(order.paymentStatus)}</div>

          ${order.shippingCountry}

      <div>
        <div class="form-label" style="margin-bottom:8px">Items</div>
        ${(order.items||[]).map(item => `

            <div>
              <div style="font-weight:500;font-size:13.5px">${item.productName}</div>
              <div style="font-size:12px;color:var(--text3)">${item.size} · ${item.color} · ×${item.quantity}</div>
            </div>

          </div>

      </div>

      <!-- Totals -->
      <div style="background:var(--bg4);padding:14px;border-radius:8px">
        <div style="display:flex;justify-content:space-between;padding:4px 0;color:var(--text2)"><span>Subtotal</span><span>$${Number(order.subtotal).toFixed(2)}</span></div>
        ${Number(order.discountAmount) > 0 ? `<div style="display:flex;justify-content:space-between;padding:4px 0;color:var(--green)"><span>Discount ${order.promoCode?`(${order.promoCode})`:''}</span><span>-$${Number(order.discountAmount).toFixed(2)}</span></div>` : ''}

        <select class="form-select" id="modal-status">
          ${['PENDING','CONFIRMED','PROCESSING','SHIPPED','DELIVERED','CANCELLED','REFUNDED'].map(s => `<option ${order.status===s?'selected':''} value="${s}">${s}</option>`).join('')}

      <div style="padding:14px 20px;display:flex;justify-content:space-between;align-items:center">

async function testPromoLive() {
  const code = document.getElementById('test-code').value.toUpperCase()
  const amount = parseFloat(document.getElementById('test-amount').value) || 0
  const area = document.getElementById('promo-result')

  try {
    const res = await post('/promo/validate', { code, orderAmount: amount }, true)
    const d = res.data
    area.innerHTML = d.valid
      ? `<div style="background:rgba(34,200,122,0.1);border:1px solid rgba(34,200,122,0.2);border-radius:8px;padding:12px 16px">

           <span style="color:var(--text2);font-size:13px">

         </div>`
      : `<div style="background:rgba(242,85,85,0.1);border:1px solid rgba(242,85,85,0.2);border-radius:8px;padding:12px 16px">
           ❌ <strong style="color:var(--red)">${d.message}</strong>
         </div>`
  } catch(e) {
    area.innerHTML = `<div style="color:var(--red)">❌ ${e.message}</div>`
  }
}

  try {
    const res = await get('/admin/orders?page=0&size=100')

    orders.forEach(o => {

        userMap[o.user.email] = {
          email: o.user.email,
          name: o.shippingName,

    c.innerHTML = `

                    <td><span class="badge badge-blue">${u.orders}</span></td>

function openModal(title, body, onConfirm = null) {
  const mc = document.getElementById('modal-container')
  mc.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">${title}</div>
          <button class="btn btn-secondary btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        ${onConfirm !== null ? `
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="modal-confirm-btn" onclick="handleModalConfirm()">
            Confirm
          </button>
        </div>` : `
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        </div>`}
      </div>
    </div>
  `
  if (onConfirm) {
    document.getElementById('modal-confirm-btn')._confirm = onConfirm
  }
}

async function handleModalConfirm() {
  const btn = document.getElementById('modal-confirm-btn')
  const fn = btn._confirm
  if (!fn) return
  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span> Saving…'
  try {
    await fn()
  } catch(e) {
    toast(e.message, 'error')
    btn.disabled = false
    btn.innerHTML = 'Confirm'
  }
}

function closeModal() {
  document.getElementById('modal-container').innerHTML = ''
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function toast(msg, type = 'info') {
  const tc = document.getElementById('toasts')
  const el = document.createElement('div')
  el.className = `toast ${type}`
  const icons = { success:'✓', error:'✕', info:'ℹ' }
  el.innerHTML = `<span style="font-size:16px">${icons[type]||'•'}</span> ${msg}`
  tc.appendChild(el)
  setTimeout(() => el.remove(), 3500)
}

function statusBadge(s) {
  const map = {
    PENDING:    'badge-amber',
    CONFIRMED:  'badge-blue',
    PROCESSING: 'badge-blue',
    SHIPPED:    'badge-teal',
    DELIVERED:  'badge-green',
    CANCELLED:  'badge-red',
    REFUNDED:   'badge-gray',
  }
  return `<span class="badge ${map[s]||'badge-gray'}">${s}</span>`
}

function payBadge(s) {
  const map = { PENDING:'badge-amber', PAID:'badge-green', FAILED:'badge-red', REFUNDED:'badge-gray' }
  return `<span class="badge ${map[s]||'badge-gray'}">${s||'PENDING'}</span>`
}

function fmtDate(d) {
  if (!d) return '—'
  return new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' })
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal()
})
</script>
